<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3e7c7c"><title>Admin Dashboard</title><link rel="stylesheet" href="style.css"></head><body><button class="themeToggle" onclick="toggleTheme()" style="position:fixed;right:12px;bottom:12px;z-index:99">🌙 Dark</button>
<header><h1>🧩 K-Map Assessment — Admin</h1><button onclick="logout()" style="width:auto">Logout</button></header><div class="wrap">
<div class="card"><h2>Assessment Results Dashboard</h2><div id="stats" class="row"></div><div id="analysis"></div><button onclick="dashboard()">Refresh Dashboard</button></div>
<div class="card"><h2>Create Assessment Problem</h2>
<div class="row"><input id="title" placeholder="Problem title"><select id="vars"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
<div class="row"><select id="form"><option>SOP</option><option>POS</option></select><select id="method"><option value="normal">Normal</option><option value="dc">Don't Care</option></select></div>
<input id="terms" placeholder="Required minterms/maxterms: 0,1,4,5"><input id="dc" placeholder="Don't cares: 2,6">
<div class="row"><input id="marks" type="number" value="10" placeholder="Marks"><select id="active"><option>TRUE</option><option>FALSE</option></select></div>
<div class="row"><label>Assessment Start<input id="startTime" type="datetime-local"></label><label>Assessment End<input id="endTime" type="datetime-local"></label></div>
<div class="row"><input id="maxAttempts" type="number" min="1" value="1" placeholder="Maximum Attempts"><input id="duration" type="number" min="0" value="0" placeholder="Duration in minutes (0=no timer)"></div>
<textarea id="note" placeholder="Question instruction"></textarea><button id="save">Save Problem</button><div id="msg"></div></div>
<div class="card"><h2>Problems</h2><button onclick="loadP()">Refresh</button><div id="plist"></div></div>
<div class="card"><h2>Detailed Student Responses</h2><button onclick="loadR()">Refresh</button><div id="rlist" style="overflow:auto"></div></div></div>
<script src="api.js"></script><script>
if(typeof window.toggleTheme!=="function"){(function(){const saved=localStorage.getItem("kmapTheme");if(saved)document.documentElement.setAttribute("data-theme",saved);function paint(){const t=(document.documentElement.getAttribute("data-theme")||"light")==="dark";document.querySelectorAll(".themeToggle").forEach(b=>b.textContent=t?"☀️ Light":"🌙 Dark")}window.toggleTheme=function(){const cur=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",cur);localStorage.setItem("kmapTheme",cur);paint()};paint()})()}
const me=requireRole("admin");
save.onclick=async()=>{try{let j=await api("addProblem",{token:me.token,problem:{title:title.value,variables:+vars.value,form:form.value,method:method.value,terms:terms.value,dontCares:dc.value,marks:+marks.value,active:active.value,note:note.value,startTime:startTime.value,endTime:endTime.value,maxAttempts:+maxAttempts.value,durationMinutes:+duration.value}});msg.className="msg ok";msg.textContent="Saved "+j.problemId;loadP();dashboard()}catch(e){msg.className="msg bad";msg.textContent=e.message}};
async function dashboard(){try{let j=await api("getDashboard",{token:me.token}),s=j.summary;stats.innerHTML=`<div class="msg"><b>${s.students}</b><br>Students</div><div class="msg"><b>${s.submissions}</b><br>Submissions</div><div class="msg"><b>${s.average}</b><br>Average Score</div><div class="msg"><b>${s.correctRate}%</b><br>Fully Correct</div>`;analysis.innerHTML="<h3>Problem-wise Analysis</h3><table><tr><th>Problem</th><th>Attempts</th><th>Average</th><th>Fully Correct</th></tr>"+j.byProblem.map(x=>`<tr><td>${x.problemId} — ${x.title}</td><td>${x.attempts}</td><td>${x.average}</td><td>${x.correct}</td></tr>`).join("")+"</table>"}catch(e){analysis.textContent=e.message}}
async function loadP(){try{let j=await api("listProblems",{token:me.token,admin:true});plist.innerHTML="<table><tr><th>ID</th><th>Title</th><th>Type</th><th>Marks</th><th>Attempts</th><th>Duration</th><th>Start</th><th>End</th></tr>"+j.problems.map(x=>`<tr><td>${x.problemId}</td><td>${x.title}</td><td>${x.variables}V ${x.form}</td><td>${x.marks}</td><td>${x.maxAttempts}</td><td>${x.durationMinutes} min</td><td>${x.startTime||"-"}</td><td>${x.endTime||"-"}</td></tr>`).join("")+"</table>"}catch(e){plist.textContent=e.message}}
async function loadR(){try{let j=await api("listResponses",{token:me.token});rlist.innerHTML="<table><tr><th>Student</th><th>Problem</th><th>Attempt</th><th>Expression</th><th>Equivalent</th><th>Coverage</th><th>Minimum</th><th>Score</th></tr>"+j.responses.map(x=>`<tr><td>${x.registerNo} ${x.studentName}</td><td>${x.problemId}</td><td>${x.attemptNo}</td><td>${x.finalAnswer}</td><td>${x.equivalent}</td><td>${x.complete}</td><td>${x.minimum}</td><td>${x.score}/${x.maxMarks}</td></tr>`).join("")+"</table>"}catch(e){rlist.textContent=e.message}}
dashboard();loadP();loadR();
</script><footer class="site-footer">© 2026 Developed and Maintained by S. Alwyn Rajiv, AP/ECE</footer></body></html>
