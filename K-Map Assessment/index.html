<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3e7c7c"><link rel="stylesheet" href="style.css"><title>K-Map Assessment</title></head><body><button class="themeToggle" onclick="toggleTheme()" style="position:fixed;right:12px;bottom:12px;z-index:99">🌙 Dark</button><header><h1>🧩 K-Map Assessment Platform</h1><p>Admin & Student Login</p></header><div class="wrap"><div class="card" style="max-width:480px;margin:50px auto"><h2>Login</h2><select id="role"><option value="student">Student</option><option value="admin">Admin</option></select><input id="user" placeholder="Register Number / Admin Username"><input id="pass" type="password" placeholder="Password"><button id="login">Login</button><div id="msg"></div></div></div><script src="api.js"></script><script>
if(typeof window.toggleTheme!=="function"){(function(){const saved=localStorage.getItem("kmapTheme");if(saved)document.documentElement.setAttribute("data-theme",saved);function paint(){const t=(document.documentElement.getAttribute("data-theme")||"light")==="dark";document.querySelectorAll(".themeToggle").forEach(b=>b.textContent=t?"☀️ Light":"🌙 Dark")}window.toggleTheme=function(){const cur=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",cur);localStorage.setItem("kmapTheme",cur);paint()};paint()})()}
login.onclick=async()=>{try{msg.className="msg";msg.textContent="Checking...";let j=await api("login",{role:role.value,username:user.value.trim(),password:pass.value});localStorage.setItem("kmapSession",JSON.stringify(j.user));location.href=j.user.role==="admin"?"admin.html":"student.html"}catch(e){msg.className="msg bad";msg.textContent=e.message}}</script><footer class="site-footer">© 2026 Developed and Maintained by S. Alwyn Rajiv, AP/ECE</footer></body></html>
